(()=>{'use strict';const items=JSON.parse(document.getElementById('items').textContent);
const $=id=>document.getElementById(id),byId=Object.fromEntries(items.map(i=>[i.id,i]));
const tabs=[['espresso'],['dessert','signature','tea'],['wine','highball']];const catnames={espresso:['ESPRESSO','에스프레소','Espresso'],dessert:['DESSERT','디저트','Dessert'],tea:['TEA','티','Tea'],wine:['WINE','와인','Wine'],highball:['HIGHBALL','하이볼','Highball'],signature:['DESSERT','디저트','Dessert']};
const notes={espresso:['익숙한 한 잔부터 새로운 선택까지. 궁금한 메뉴는 직원에게 편하게 물어보세요.','From familiar favorites to something new. Feel free to ask our team.'],dessert:['달콤한 시간을 곁들이고 싶을 때. 메뉴 구성은 직원에게 편하게 문의해 주세요.','A little something sweet. Ask our team about each option.'],tea:['편안하게 쉬어갈 시간, 차 한 잔과 함께.','A quiet moment with a cup of tea.'],wine:['좋은 대화가 머무는 시간.','Take your time and enjoy the moment.'],highball:['오늘의 기분에 맞춰 천천히 골라보세요.','Choose what suits your moment.']};
const order=['espresso','conpanna','pieno','strappazzato','romano','churros','alco_churros','turmeric','chamomile','hibiscus','red_wine','white_wine','champagne','hendricks','jackapple','glengrant','glendronach'];
const listSub={espresso:['에스프레소 5가지','Five espresso choices'],dessert:['츄러스 2가지','Two churros choices'],tea:['차 3가지','Three teas'],wine:['와인 · 샴페인','Wine & champagne'],highball:['하이볼 4가지','Four highballs']};
let pg=0,current='espresso',english=false,comparison=[],galleryPhoto=null;
const visible=()=>items.filter(i=>tabs[pg].includes(i.category)).sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));const family=i=>i.category==='signature'?'dessert':i.category;
function itemPage(i){return tabs.findIndex(x=>x.includes(i.category))}
function money(i){return i.price===null?(english?'Ask for price':'가격 변동'):(i.price.toLocaleString('ko-KR')+(english?' KRW':'원'))}
function name(i){return english?i.en:i.name}
function fillTranslations(){document.querySelectorAll('[data-ko][data-en]').forEach(el=>el.textContent=el.dataset[english?'en':'ko']);$('lang-toggle').textContent=english?'한국어':'EN';$('lang-toggle').setAttribute('aria-pressed',String(english));document.documentElement.lang=english?'en':'ko';$('gallery-open').textContent=english?'Photo menu':'메뉴 사진';$('photo-close').setAttribute('aria-label',english?'Close':'닫기');$('gallery-close').setAttribute('aria-label',english?'Close':'닫기');$('gallery-title').textContent=english?'Menu photos':'사진으로 메뉴 보기';$('compare-trigger').firstElementChild.textContent=english?'Compare within this category':'같은 종류 메뉴 비교하기';$('compare-help').textContent=english?'Choose up to two items.':'한 번에 두 메뉴를 선택할 수 있어요.';$('back-to-menu').textContent=english?'Back to menu':'다른 메뉴 보기';}
function renderList(){const root=$('menu-list');root.replaceChildren();const gs=[...new Set(visible().map(family))];$('list-count').textContent=('0'+(pg+1)).slice(-2)+' / 03';$('list-note').textContent=gs.map(g=>catnames[g][0]).join(' & ');document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-selected',String(Number(b.dataset.page)===pg)));
 for(const group of gs){const sec=document.createElement('section');sec.className='list-group';const h=document.createElement('div');h.className='ghead';const hd=document.createElement('h2');hd.textContent=catnames[group][0];const sub=document.createElement('span');sub.textContent=listSub[group][english?1:0];h.append(hd,sub);sec.append(h);
 for(const i of visible().filter(x=>family(x)===group)){const b=document.createElement('button');b.type='button';b.className='menu-item'+(i.id==='alco_churros'?' featured':'');b.dataset.id=i.id;b.setAttribute('aria-current',String(current===i.id));b.setAttribute('aria-label',name(i)+', '+money(i));const n=document.createElement('span');n.className='item-name';const main=document.createElement('strong');main.textContent=name(i);const small=document.createElement('small');small.textContent=english?i.name:i.en;n.append(main,small);const p=document.createElement('span');p.className='item-price';p.textContent=money(i);const arrow=document.createElement('span');arrow.className='item-chevron';arrow.textContent='›';arrow.setAttribute('aria-hidden','true');b.append(n,p,arrow);b.addEventListener('click',()=>{showItem(i.id);if(window.innerWidth<=730)$('detail-panel').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});});sec.append(b);}
 root.append(sec)} }
function showItem(id){if(byId[current]&&family(byId[current])!==family(byId[id]))comparison=[];current=id;const i=byId[id];document.querySelectorAll('.menu-item').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===id)));$('detail-category').textContent=catnames[family(i)][0];$('detail-name').textContent=name(i);$('detail-roman').textContent=english?i.name:i.en;$('detail-price').textContent=money(i);$('detail-copy').textContent=notes[family(i)][english?1:0];const art=$('visual');art.replaceChildren();if(i.photo){const photo=document.createElement('img');photo.alt=(english?'Photo of ':'메뉴 사진 · ')+name(i);photo.src=i.photo;art.append(photo);}else{const artWrap=document.createElement('div');artWrap.className='abstract-art';artWrap.setAttribute('aria-hidden','true');const inner=document.createElement('div');inner.className='art-inner';const word=document.createElement('strong');word.textContent='ALCO';const cap=document.createElement('span');cap.textContent='a little pause';inner.append(word,cap);artWrap.append(inner);art.append(artWrap)}$('photo-zoom').hidden=!i.photo;$('photo-zoom').textContent=english?'View photo':'사진 크게 보기';renderCompare();}
function renderCompare(){const i=byId[current],list=visible().filter(x=>family(x)===family(i));const box=$('compare-buttons');box.replaceChildren();for(const item of list){const b=document.createElement('button');b.type='button';b.className='choice-chip'+(comparison.includes(item.id)?' selected':'');b.textContent=name(item);b.setAttribute('aria-pressed',String(comparison.includes(item.id)));b.addEventListener('click',()=>{if(comparison.includes(item.id))comparison=comparison.filter(x=>x!==item.id);else comparison=[...comparison.slice(-1),item.id];renderCompare()});box.append(b)}const output=$('compare-output');output.replaceChildren();for(const id of comparison){const item=byId[id],row=document.createElement('div');row.className='compare-row';const n=document.createElement('span');n.textContent=name(item);const p=document.createElement('b');p.textContent=money(item);row.append(n,p);output.append(row)}if(comparison.length===2){const [a,b]=comparison.map(id=>byId[id]);if(a.price!==null&&b.price!==null){const d=document.createElement('p');d.className='compare-diff';d.textContent=(english?'Price difference: ':'가격 차이 ')+Math.abs(a.price-b.price).toLocaleString('ko-KR')+(english?' KRW':'원');output.append(d)}}}
function changePage(n){pg=n;current=visible()[0]?.id||items.find(i=>tabs[pg].includes(i.category)).id;comparison=[];renderList();showItem(current)}
function openPhoto(i){if(!i.photo)return;$('photo-name').textContent=name(i);$('photo-title').textContent=english?'Menu photo':'메뉴 사진';$('photo-price').textContent=money(i);$('photo-image').src=i.photo;$('photo-image').alt=name(i);$('photo-dialog').showModal()}
function gallery(){const box=$('gallery-grid');box.replaceChildren();for(const i of items.filter(x=>x.photo)){const b=document.createElement('button');b.className='gallery-card';b.type='button';const photo=document.createElement('img');photo.src=i.photo;photo.alt=name(i);const n=document.createElement('b');n.textContent=name(i);const p=document.createElement('small');p.textContent=money(i);b.append(photo,n,p);b.addEventListener('click',()=>{$('gallery-dialog').close();pg=itemPage(i);current=i.id;comparison=[];renderList();showItem(i.id);if(window.innerWidth<=730)$('detail-panel').scrollIntoView({behavior:'smooth'});});box.append(b)}$('gallery-dialog').showModal()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>changePage(Number(b.dataset.page))));$('lang-toggle').addEventListener('click',()=>{english=!english;fillTranslations();renderList();showItem(current);});$('gallery-open').addEventListener('click',gallery);$('gallery-close').addEventListener('click',()=>$('gallery-dialog').close());$('photo-close').addEventListener('click',()=>$('photo-dialog').close());$('photo-zoom').addEventListener('click',()=>openPhoto(byId[current]));$('back-to-menu').addEventListener('click',()=>$('list-panel').scrollIntoView({behavior:'smooth'}));$('compare-trigger').addEventListener('click',()=>{const b=$('compare-body');b.hidden=!b.hidden;$('compare-trigger').setAttribute('aria-expanded',String(!b.hidden));$('compare-arrow').textContent=b.hidden?'＋':'−'});for(const id of ['gallery-dialog','photo-dialog'])$(id).addEventListener('click',e=>{if(e.target===$(id))$(id).close()});fillTranslations();changePage(0);
})();
</script></body></html>
